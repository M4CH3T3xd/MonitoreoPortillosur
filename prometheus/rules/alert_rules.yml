groups:
  # ================================================================
  # CONECTIVIDAD — SUCURSALES
  # ================================================================
  - name: alertas_conectividad_sucursales
    rules:
      - alert: SucursalInalcanzable
        expr: probe_success{area="infraestructura", sucursal!=""} == 0
        for: 2m
        labels:
          severity: fatal
          tipo: sucursal
        annotations:
          summary: "🔴 Sucursal sin conexión"
          description: "La sucursal {{ $labels.sucursal }} (Gateway: {{ $labels.instance }}) no responde al ping desde hace más de 2 minutos."
          valor: "Sin respuesta ICMP"

      - alert: SucursalLatenciaAlta
        expr: avg_over_time(probe_icmp_duration_seconds{area="infraestructura", sucursal!=""}[5m]) > 0.15
        for: 3m
        labels:
          severity: warning
          tipo: sucursal
        annotations:
          summary: "🐌 Latencia alta en sucursal"
          description: "La sucursal {{ $labels.sucursal }} presenta latencia elevada en los últimos 3 minutos."
          valor: '{{ printf "%.0f" (query "avg_over_time(probe_icmp_duration_seconds{instance=\"$labels.instance\"}[5m]) * 1000" | first | value) }} ms'

      - alert: SucursalPerdidaPaquetes
        expr: (1 - avg_over_time(probe_success{area="infraestructura", sucursal!=""}[5m])) * 100 > 10
        for: 5m
        labels:
          severity: critical
          tipo: sucursal
        annotations:
          summary: "📦 Pérdida de paquetes en sucursal"
          description: "La sucursal {{ $labels.sucursal }} presenta pérdida de paquetes sostenida en los últimos 5 minutos."
          valor: "Más del 10% de pérdida"

  # ================================================================
  # CONECTIVIDAD — SERVIDORES
  # ================================================================
  - name: alertas_conectividad_servidores
    rules:
      - alert: ServidorInalcanzable
        expr: probe_success{area="infraestructura", servidor!=""} == 0
        for: 2m
        labels:
          severity: fatal
          tipo: servidor
        annotations:
          summary: "🔴 Servidor sin conexión"
          description: "El servidor {{ $labels.servidor }} (IP: {{ $labels.instance }}) no responde al ping desde hace más de 2 minutos."
          valor: "Sin respuesta ICMP"

      - alert: ServidorSinMetricas
        expr: up{area="infraestructura"} == 0
        for: 5m
        labels:
          severity: warning
          tipo: servidor
        annotations:
          summary: "🟡 Exportador caído"
          description: "No se reciben métricas de {{ $labels.datos }} ({{ $labels.instance }}). El exportador podría estar apagado o el servicio detenido."
          valor: "up == 0"

      - alert: RedLentaServidor
        expr: avg_over_time(probe_icmp_duration_seconds{area="infraestructura", servidor!=""}[5m]) > 0.15
        for: 3m
        labels:
          severity: warning
          tipo: servidor
        annotations:
          summary: "🐌 Latencia alta en servidor"
          description: "El servidor {{ $labels.servidor }} presenta latencia elevada en los últimos 3 minutos."
          valor: "Ping > 150ms sostenido"

  # ================================================================
  # INFRAESTRUCTURA CRÍTICA — RECURSOS
  # ================================================================
  - name: alertas_infraestructura_critica
    rules:
      - alert: CPUSaturado
        expr: instance:cpu_usage:percent > 90
        for: 5m
        labels:
          severity: critical
          tipo: servidor
        annotations:
          summary: "🔥 CPU crítico"
          description: "El servidor {{ $labels.datos }} ha estado con CPU sobre el 90% por más de 5 minutos."
          valor: '{{ printf "%.1f" $value }}%'

      - alert: RAMSaturada
        expr: instance:ram_usage:percent > 90
        for: 5m
        labels:
          severity: critical
          tipo: servidor
        annotations:
          summary: "🧠 RAM al límite"
          description: "El servidor {{ $labels.datos }} está usando más del 90% de su memoria RAM."
          valor: '{{ printf "%.1f" $value }}%'

      - alert: DiscoCasiLleno
        expr: instance:disk_root_usage:percent > 90
        for: 10m
        labels:
          severity: critical
          tipo: servidor
        annotations:
          summary: "💽 Disco casi lleno"
          description: "El disco principal de {{ $labels.datos }} superó el 90% de capacidad. Liberar espacio urgente."
          valor: '{{ printf "%.1f" $value }}%'

      - alert: SaturacionColaCPU
        expr: instance:processor_queue:length > 10
        for: 5m
        labels:
          severity: warning
          tipo: servidor
        annotations:
          summary: "🚦 Cola de CPU saturada"
          description: "El procesador de {{ $labels.datos }} no da abasto. Hay procesos acumulados esperando CPU."
          valor: '{{ printf "%.0f" $value }} procesos en cola'